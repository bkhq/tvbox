<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>手机控制</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/jquery.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="app">
        <div class="app-body">
            <!-- 配置 -->
            <div id="panel1" class="tab-panel active">
                <div class="panel-content">
                    <div class="section" data-type="0">
                        <div class="section-title">点播</div>
                        <div class="config-list" id="config_list_0"></div>
                        <div class="field-row">
                            <div class="md-field short"><input id="config_name_0" class="md-input" type="text" placeholder="名称" /></div>
                            <div class="md-field"><input id="config_url_0" class="md-input" type="text" placeholder="配置地址" /></div>
                        </div>
                        <button class="md-btn md-btn-filled md-btn-full" onclick="addConfig(0)">添加并使用</button>
                    </div>
                    <div class="section" data-type="1">
                        <div class="section-title">直播</div>
                        <div class="config-list" id="config_list_1"></div>
                        <div class="field-row">
                            <div class="md-field short"><input id="config_name_1" class="md-input" type="text" placeholder="名称" /></div>
                            <div class="md-field"><input id="config_url_1" class="md-input" type="text" placeholder="配置地址" /></div>
                        </div>
                        <button class="md-btn md-btn-filled md-btn-full" onclick="addConfig(1)">添加并使用</button>
                    </div>
                    <div class="section" data-type="2">
                        <div class="section-title">壁纸</div>
                        <div class="config-list" id="config_list_2"></div>
                        <div class="field-row">
                            <div class="md-field"><input id="config_url_2" class="md-input" type="text" placeholder="壁纸地址" /></div>
                        </div>
                        <button class="md-btn md-btn-filled md-btn-full" onclick="addConfig(2)">添加并使用</button>
                    </div>
                </div>
            </div>
            <!-- 播放 -->
            <div id="panel2" class="tab-panel">
                <div class="panel-content">
                    <div class="section">
                        <div class="now-title" id="player_title">未在播放</div>
                        <div class="now-time"><span id="player_position">00:00</span><span id="player_duration">00:00</span></div>
                        <div class="control-grid">
                            <button class="md-btn md-btn-tonal" onclick="control('prev')">上一集</button>
                            <button class="md-btn md-btn-filled" id="player_toggle" onclick="control('toggle')">播放</button>
                            <button class="md-btn md-btn-tonal" onclick="control('next')">下一集</button>
                            <button class="md-btn md-btn-tonal" onclick="control('seek', -60000)">-60s</button>
                            <button class="md-btn md-btn-tonal" onclick="control('seek', -15000)">-15s</button>
                            <button class="md-btn md-btn-tonal" onclick="control('seek', 15000)">+15s</button>
                            <button class="md-btn md-btn-tonal" onclick="control('seek', 60000)">+60s</button>
                            <select class="md-input md-select" id="player_speed" onchange="control('speed', this.value)">
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1">1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2.0x</option>
                                <option value="3">3.0x</option>
                            </select>
                            <button class="md-btn md-btn-tonal" onclick="control('stop')">停止</button>
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-title">推送播放</div>
                        <div class="md-field"><input id="push_url" class="md-input" type="text" placeholder="请输入播放地址" /></div>
                        <button class="md-btn md-btn-filled md-btn-full" onclick="push()">播放</button>
                    </div>
                    <div class="section">
                        <div class="section-title">搜索</div>
                        <div class="md-field"><input id="keyword" class="md-input" type="text" placeholder="请输入关键字" /></div>
                        <button class="md-btn md-btn-filled md-btn-full" onclick="search()">搜索</button>
                    </div>
                </div>
            </div>
            <!-- 设置 -->
            <div id="panel3" class="tab-panel">
                <div class="panel-content">
                    <div class="section">
                        <div class="section-title">播放器</div>
                        <label class="setting-row"><span>播放引擎</span><select class="md-select" id="setting_engine" onchange="setting('engine', this.value)"></select></label>
                        <label class="setting-row"><span>渲染方式</span><select class="md-select" id="setting_render" onchange="setting('render', this.value)"></select></label>
                        <label class="setting-row"><span>画面比例</span><select class="md-select" id="setting_scale" onchange="setting('scale', this.value)"></select></label>
                        <label class="setting-row"><span>后台播放</span>
                            <select class="md-select" id="setting_background" onchange="setting('background', this.value)">
                                <option value="0">关</option>
                                <option value="1">开</option>
                                <option value="2">画中画</option>
                            </select>
                        </label>
                        <label class="setting-row"><span>缓冲倍数</span><input class="md-select" id="setting_buffer" type="number" min="1" max="15" onchange="setting('buffer', this.value)" /></label>
                        <label class="setting-row"><span>默认倍速</span><input class="md-select" id="setting_speed" type="number" min="0.1" max="5" step="0.05" onchange="setting('speed', this.value)" /></label>
                    </div>
                    <div class="section">
                        <div class="section-title">通用</div>
                        <label class="setting-row"><span>无痕模式</span><input type="checkbox" id="setting_incognito" onchange="setting('incognito', this.checked)" /></label>
                        <label class="setting-row"><span>广告过滤</span><input type="checkbox" id="setting_adblock" onchange="setting('adblock', this.checked)" /></label>
                        <label class="setting-row"><span>AirPlay 投屏</span><input type="checkbox" id="setting_airplay" onchange="setting('airplay', this.checked)" /></label>
                        <div class="section-title">AirPlay 名称</div>
                        <div class="md-field"><input id="setting_airplay_name" class="md-input" type="text" placeholder="iPhone 投屏列表中显示的名称" /></div>
                        <button class="md-btn md-btn-tonal md-btn-full" onclick="setting('airplay_name', $('#setting_airplay_name').val())">保存</button>
                        <div class="section-title">User-Agent</div>
                        <div class="md-field"><input id="setting_ua" class="md-input" type="text" placeholder="留空使用默认" /></div>
                        <button class="md-btn md-btn-tonal md-btn-full" onclick="setting('ua', $('#setting_ua').val())">保存</button>
                    </div>
                    <div class="section">
                        <div class="section-title">已配对设备</div>
                        <div class="config-list" id="device_list"></div>
                    </div>
                    <div class="section version" id="version"></div>
                </div>
            </div>
            <!-- 文件 -->
            <div id="panel4" class="tab-panel">
                <input type="file" id="file_uploader" onchange="onFileSelected()" multiple />
                <div class="md-toolbar">
                    <button class="md-btn md-btn-tonal" onclick="uploadFile()">上传文件</button>
                    <button class="md-btn md-btn-tonal" onclick="showNewFolderDialog()">新建文件夹</button>
                </div>
                <div id="file_list"></div>
            </div>
        </div>
        <nav class="md-nav-bar">
            <div id="tab1" class="md-nav-item active" onclick="showPanel(1)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM10 9h8v2h-8zm0 3h4v2h-4zm0-6h8v2h-8z"/></svg>
                </div>
                <span class="md-nav-label">配置</span>
            </div>
            <div id="tab2" class="md-nav-item" onclick="showPanel(2)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-13.5v9l6-4.5z"/></svg>
                </div>
                <span class="md-nav-label">播放</span>
            </div>
            <div id="tab3" class="md-nav-item" onclick="showPanel(3)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.09-.16-.26-.25-.44-.25-.06 0-.12.01-.17.03l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.06-.02-.12-.03-.18-.03-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.09.16.26.25.44.25.06 0 .12-.01.17-.03l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                </div>
                <span class="md-nav-label">设置</span>
            </div>
            <div id="tab4" class="md-nav-item" onclick="showPanel(4)">
                <div class="md-nav-indicator">
                    <svg class="md-nav-icon" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M9.17 6l2 2H20v10H4V6h5.17M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                </div>
                <span class="md-nav-label">文件</span>
            </div>
        </nav>
    </div>
    <!-- Dialog: 配对 -->
    <div id="pairDialog" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">配对电视</div>
            <div class="md-dialog-body">
                <div class="pair-hint">在电视上打开「手机控制」，输入屏幕上的 6 位配对码</div>
                <div class="md-field"><input id="pair_code" class="md-input" type="tel" inputmode="numeric" maxlength="6" placeholder="配对码" /></div>
                <div class="md-field"><input id="pair_name" class="md-input" type="text" placeholder="本机名称" /></div>
            </div>
            <div class="md-dialog-actions">
                <button onclick="confirmPair()" class="md-dialog-btn">配对</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除设备 -->
    <div id="delDevice" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除设备</div>
            <div class="md-dialog-body" id="delDeviceContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelDevice(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelDevice(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除配置 -->
    <div id="delConfig" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除配置</div>
            <div class="md-dialog-body" id="delConfigContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelConfig(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelConfig(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 本地路径 -->
    <div id="fileInfoDialog" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">本地路径</div>
            <div class="md-dialog-body" id="fileUrl"></div>
            <div class="md-dialog-actions">
                <button onclick="pushFile(0)" class="md-dialog-btn">关闭</button>
                <button onclick="pushFile(1)" class="md-dialog-btn">使用</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 确认上传 -->
    <div id="uploadTip" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">确认上传？</div>
            <div class="md-dialog-body" id="uploadTipContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmUpload(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmUpload(1)" class="md-dialog-btn">确定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 新建文件夹 -->
    <div id="newFolder" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">新建文件夹</div>
            <div class="md-dialog-body">
                <input id="newFolderContent" class="md-input" type="text" placeholder="请输入文件夹名称" />
            </div>
            <div class="md-dialog-actions">
                <button onclick="confirmNewFolder(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmNewFolder(1)" class="md-dialog-btn">确定</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除文件夹 -->
    <div id="delFolder" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除文件夹</div>
            <div class="md-dialog-body" id="delFolderContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFolder(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelFolder(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Dialog: 删除文件 -->
    <div id="delFile" class="md-dialog-overlay">
        <div class="md-dialog">
            <div class="md-dialog-title">删除文件</div>
            <div class="md-dialog-body" id="delFileContent"></div>
            <div class="md-dialog-actions">
                <button onclick="confirmDelFile(0)" class="md-dialog-btn">取消</button>
                <button onclick="confirmDelFile(1)" class="md-dialog-btn error">删除</button>
            </div>
        </div>
    </div>
    <!-- Snackbar -->
    <div id="warnToast">
        <div class="md-snackbar" id="warnToastContent"></div>
    </div>
    <!-- Loading -->
    <div id="loadingToast">
        <div class="md-progress-wrap">
            <svg class="md-progress" viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20"/>
            </svg>
        </div>
    </div>
</body>
</html>
