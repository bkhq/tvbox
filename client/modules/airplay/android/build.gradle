plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.bk.tv'
version = '1.0.0'

android {
  namespace 'io.bk.tv.airplay'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
  // The vendored library uses records and switch expressions; java.time needs
  // core library desugaring on API < 26 (enabled in the app by app.plugin.js).
  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// Same versions as gradle/libs.versions.toml of the Java app.
dependencies {
  api 'org.slf4j:slf4j-api:2.0.17'
  implementation 'org.whispersystems:curve25519-java:0.5.0'
  implementation 'com.googlecode.plist:dd-plist:1.28'
  implementation 'net.i2p.crypto:eddsa:0.3.0'
  implementation 'org.jmdns:jmdns:3.6.1'
  implementation 'io.lindstrom:m3u8-parser:0.30'
  implementation 'io.netty:netty-codec-http:4.1.121.Final'
  implementation 'io.netty:netty-handler:4.1.121.Final'
  compileOnly 'org.projectlombok:lombok:1.18.38'
  annotationProcessor 'org.projectlombok:lombok:1.18.38'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
