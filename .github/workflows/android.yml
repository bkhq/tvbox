name: Build APKs

# Legacy Java app (app/): builds only, no releases. vX.Y.Z tags release the
# React Native app through rn-release.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - ".github/workflows/worker.yml"
      - ".github/workflows/tvbox*.yml"
      - "spider/**"
      - ".github/workflows/spider.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The Media3 AARs are built from media/ and cached by its contents, so
      # they are rebuilt only when the fork changes.
      - name: Restore media AARs
        id: aars
        uses: actions/cache@v4
        with:
          path: app/libs/lib-*.aar
          key: media-aars-${{ hashFiles('media/**', '!media/**/buildout/**') }}

      - name: Build media AARs
        if: steps.aars.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > media/local.properties
          bash media/build-aars.sh

      - name: Configure signing
        run: cp keystore/release.properties local.properties

      - name: Build
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          args=()
          [ -n "$WORKER_URL" ] && args+=("-PupdateUrl=${WORKER_URL%/}/u" "-PworkerUrl=${WORKER_URL%/}")
          bash ./gradlew --no-daemon :app:testArm64_v8aDebugUnitTest assembleRelease "${args[@]}"

      - name: Collect
        run: |
          mkdir dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
