name = "tv-bk-io"
main = "src/workers/entry.ts"
compatibility_date = "2026-09-01"
# node:crypto / node:buffer / node:path / node:util are used across the shared
# codebase (PBKDF2 hashing, base64url encoding, path joins).
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL even when a custom domain is attached: adding a
# route otherwise turns it off, which leaves nothing to reach the deployment
# by while the domain is still being provisioned.
workers_dev = true

# The deployment's origin; the zone must be on the same Cloudflare account.
routes = [
  { pattern = "tv.bk.io", zone_name = "bk.io", custom_domain = true },
]

# One Durable Object class holds the SQLite database and runs the app.
[[durable_objects.bindings]]
name = "APP"
class_name = "AppDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppDurableObject"]

# Blob storage for the file module (FILE_STORAGE_DRIVER=r2).
[[r2_buckets]]
binding = "FILES"
bucket_name = "tvbox-files"

# The media library, written by the console and read by
# `/s/<token>/media` (src/workers/media). The deploy workflow finds the
# database by name in the deploy account (creating it when missing), fills
# in its id and applies the migrations.
[[d1_databases]]
binding = "MEDIA"
database_name = "tv-bk-io"
migrations_dir = "d1/media"

# Every request reaches the Worker first (src/workers/entry.ts), which
# routes: `/` is the download page, `/s/*` and `/u/*` are answered from R2,
# `${BASE_PATH}/api/*` goes to the Durable Object, and the rest of
# `${BASE_PATH}/*` is the console SPA from these assets (built into
# dist/mg/), falling back to its index.html.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

# Non-secret configuration. Secrets (OAUTH_CLIENT_SECRET,
# SERVICE_TOKEN_RELEASE) and the per-deployment OIDC settings are passed by
# the deploy workflow — never in this file.
[vars]
NODE_ENV = "production"
APP_NAME = "tvbox"
APP_DISPLAY_NAME = "TVBox"
# The admin console and its API live under this prefix; the site root is the
# public download page. Must match the default in apps/web/vite.config.ts.
BASE_PATH = "/mg"
LOG_TO_STDOUT = "true"
FILE_STORAGE_DRIVER = "r2"
# Presigning needs the R2 S3 API and a key pair, which a bucket binding does
# not carry; downloads stream through the Worker instead.
FILE_PRESIGN_ENABLED = "false"
TRUST_PROXY = "false"
# Upstreams are synced by the "TVBox sources" workflow, which also probes
# entries before publishing; a sync here would publish unchecked entries.
TVBOX_SYNC_INTERVAL_MINUTES = "0"
