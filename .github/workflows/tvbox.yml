name: TVBox sources

# Applies worker/tvbox/upstreams.json to the deployment, syncs every declared
# upstream and publishes when anything changed. The deployment also syncs on
# its own schedule; this is for changing the upstream list, or pulling now.

on:
  push:
    branches: [main]
    paths:
      - "worker/tvbox/**"
      - "worker/scripts/tvbox-apply.ts"
      - ".github/workflows/tvbox.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after syncing"
        type: choice
        options: [changed, always, never]
        default: changed

permissions:
  contents: read

concurrency:
  group: tvbox-sources
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The console's base path (BASE_PATH in worker/apps/api/wrangler.toml).
      TVBOX_URL: ${{ vars.WORKER_URL }}/mg
      TVBOX_API_TOKEN: ${{ secrets.TVBOX_API_TOKEN }}
    steps:
      - name: Require the deployment URL and an API token
        run: |
          if [ "$TVBOX_URL" = "/mg" ] || [ -z "$TVBOX_API_TOKEN" ]; then
            echo "::error::set the variable WORKER_URL and the secret TVBOX_API_TOKEN (an API token with the tvbox:write scope)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Apply, sync and publish
        working-directory: worker
        env:
          PUBLISH: ${{ inputs.publish || 'changed' }}
        run: |
          flag=""
          [ "$PUBLISH" = always ] && flag="--publish"
          [ "$PUBLISH" = never ] && flag="--no-publish"
          bun scripts/tvbox-apply.ts tvbox/upstreams.json $flag
