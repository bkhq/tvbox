name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        run: cp keystore/release.properties local.properties

      # Release tags are vX.Y.Z; versionCode = X*10000 + Y*100 + Z, so it
      # grows with every release and the app can compare versions. Other
      # builds keep the defaults in app/build.gradle.
      - name: Version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::release tags must look like v1.2.3 (minor and patch below 100), got $GITHUB_REF_NAME"
            exit 1
          fi
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          args=()
          [ -n "$VERSION_CODE" ] && args+=("-PversionCode=$VERSION_CODE" "-PversionName=$VERSION_NAME")
          [ -n "$WORKER_URL" ] && args+=("-PupdateUrl=${WORKER_URL%/}/u")
          bash ./gradlew --no-daemon assembleRelease "${args[@]}"

      - name: Collect
        run: |
          mkdir dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes

      # APKs go straight to the bucket; the worker only records them and
      # rewrites the update manifests the app polls.
      - name: Upload APKs to the worker bucket
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          bucket="$(grep -oP 'bucket_name = "\K[^"]+' worker/apps/api/wrangler.toml)"
          for apk in dist/*.apk; do
            npx --yes wrangler@4 r2 object put "$bucket/tvbox/releases/$VERSION_CODE/$(basename "$apk")" \
              --file "$apk" --content-type application/vnd.android.package-archive --remote
          done

      - name: Register the release with the worker
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SERVICE_TOKEN_RELEASE: ${{ secrets.SERVICE_TOKEN_RELEASE }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          assets="$(for apk in dist/*.apk; do
            name="$(basename "$apk" .apk)"
            jq -n --arg mode "${name%%-*}" --arg abi "${name#*-}" \
              --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" --argjson size "$(stat -c%s "$apk")" \
              '{mode: $mode, abi: $abi, sha256: $sha256, size: $size}'
          done | jq -s .)"
          jq -n --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" --arg notes "$notes" --argjson assets "$assets" \
            '{versionCode: $versionCode, versionName: $versionName, notes: $notes, assets: $assets}' > release.json
          curl --fail-with-body -sS -X POST "${WORKER_URL%/}/api/raw/releases" \
            -H "Authorization: Bearer $SERVICE_TOKEN_RELEASE" -H "Content-Type: application/json" --data @release.json
