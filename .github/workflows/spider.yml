name: Spider

# Builds tvbox.jar, our own spider jar, from spider/ (based on
# FongMi/CatVodSpider), and on main uploads it to the deployment and
# publishes when it changed. Sites use it with "api": "csp_<Class>" and
# "jar": "@tvbox", which publishing replaces with the latest upload.

on:
  push:
    branches: [main]
    paths:
      - "spider/**"
      - ".github/workflows/spider.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build tvbox.jar
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.github.catvod.spider.MacCmsTest" spiderJar

      - uses: actions/upload-artifact@v4
        with:
          name: tvbox-jar
          path: |
            spider/build/tvbox.jar
            spider/build/tvbox.jar.md5

      - name: Upload to the deployment and publish
        if: github.ref == 'refs/heads/main'
        env:
          # The console's base path (BASE_PATH in worker/apps/api/wrangler.toml).
          TVBOX_URL: ${{ vars.WORKER_URL }}/mg
          TVBOX_API_TOKEN: ${{ secrets.TVBOX_API_TOKEN }}
        run: |
          if [ "$TVBOX_URL" = "/mg" ] || [ -z "$TVBOX_API_TOKEN" ]; then
            echo "::warning::WORKER_URL or TVBOX_API_TOKEN is not set; not uploaded"
            exit 0
          fi
          auth="Authorization: Bearer $TVBOX_API_TOKEN"
          result=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
            --data-binary @build/tvbox.jar "$TVBOX_URL/api/tvbox/spider-jar")
          echo "$result" | jq -c .data
          if [ "$(echo "$result" | jq -r .data.changed)" = true ]; then
            curl -fsS -X POST -H "$auth" "$TVBOX_URL/api/tvbox/publishes" | jq -c '.data | {id, counts}'
          fi
