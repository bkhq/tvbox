<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>手机控制</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="app">
        <main class="app-body" id="app_body">
            <!-- 遥控 -->
            <section class="tab-panel active" data-panel="remote">
                <div class="now-card" id="now_card" data-active="0">
                    <div class="now-head">
                        <div class="now-label">正在播放</div>
                        <div class="now-title" id="np_title">未在播放</div>
                    </div>
                    <div class="now-body">
                        <input type="range" class="seek-bar" id="np_seek" min="0" max="0" step="1000" value="0" disabled />
                        <div class="now-time"><span id="np_position">00:00</span><span id="np_duration">00:00</span></div>
                        <div class="transport">
                            <button class="icon-btn" data-action="control" data-do="prev" aria-label="上一集">
                                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                            </button>
                            <button class="icon-btn" data-action="control" data-do="seek" data-value="-15000" aria-label="后退 15 秒">
                                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
                                <span>15</span>
                            </button>
                            <button class="icon-btn primary" id="np_toggle" data-action="control" data-do="toggle" aria-label="播放 / 暂停">
                                <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>
                            <button class="icon-btn" data-action="control" data-do="seek" data-value="15000" aria-label="前进 15 秒">
                                <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg>
                                <span>15</span>
                            </button>
                            <button class="icon-btn" data-action="control" data-do="next" aria-label="下一集">
                                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                            </button>
                        </div>
                        <div class="now-extra">
                            <select class="chip-select" id="np_speed" data-action="speed">
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1">1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2.0x</option>
                                <option value="3">3.0x</option>
                            </select>
                            <button class="chip" data-action="control" data-do="stop">停止</button>
                        </div>
                    </div>
                </div>

                <div class="dpad">
                    <button class="dpad-btn dpad-up" data-action="key" data-value="up" aria-label="上"><svg viewBox="0 0 24 24"><path d="M7.4 15.4L12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button>
                    <button class="dpad-btn dpad-left" data-action="key" data-value="left" aria-label="左"><svg viewBox="0 0 24 24"><path d="M15.4 7.4L10.8 12l4.6 4.6L14 18l-6-6 6-6z"/></svg></button>
                    <button class="dpad-btn dpad-ok" data-action="key" data-value="ok">OK</button>
                    <button class="dpad-btn dpad-right" data-action="key" data-value="right" aria-label="右"><svg viewBox="0 0 24 24"><path d="M8.6 16.6l4.6-4.6-4.6-4.6L10 6l6 6-6 6z"/></svg></button>
                    <button class="dpad-btn dpad-down" data-action="key" data-value="down" aria-label="下"><svg viewBox="0 0 24 24"><path d="M7.4 8.6L12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
                </div>
                <div class="remote-row">
                    <button class="tonal-btn" data-action="key" data-value="back">
                        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>返回
                    </button>
                    <button class="tonal-btn" data-action="key" data-value="menu">
                        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>菜单
                    </button>
                </div>
                <div class="remote-row">
                    <button class="tonal-btn" data-action="volume" data-value="down" aria-label="音量减"><svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0 0 16 8v8a4.5 4.5 0 0 0 2.5-4zM5 9v6h4l5 5V4L9 9H5z"/></svg>−</button>
                    <button class="tonal-btn" data-action="volume" data-value="mute" aria-label="静音"><svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12c0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1c1.4-.3 2.6-1 3.7-1.8l2 2L21 19.7l-9-9-7.7-7.7zM12 4L9.9 6.1 12 8.2V4z"/></svg></button>
                    <button class="tonal-btn" data-action="volume" data-value="up" aria-label="音量加"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>+</button>
                </div>
                <form class="text-row" id="remote_form">
                    <input id="remote_text" class="text-input" type="text" placeholder="输入文字发送到电视的输入框" autocomplete="off" />
                    <button class="tonal-btn send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
                </form>
            </section>

            <!-- 搜索 -->
            <section class="tab-panel" data-panel="search">
                <form class="search-bar" id="search_form">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16c1.6 0 3.1-.6 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
                    <input id="search_input" class="search-input" type="search" placeholder="搜索片名，或粘贴播放链接" autocomplete="off" enterkeyhint="search" />
                    <button class="search-clear" type="button" id="search_clear" aria-label="清除">✕</button>
                </form>
                <div id="search_link" class="link-card hidden">
                    <div class="link-hint">这是一个播放链接</div>
                    <button class="filled-btn" data-action="push-link">在电视上播放</button>
                </div>
                <div id="search_words">
                    <div class="words-block" id="words_history_block">
                        <div class="section-title">搜索历史</div>
                        <div class="chips" id="words_history"></div>
                    </div>
                    <div class="words-block" id="words_hot_block">
                        <div class="section-title">热门搜索</div>
                        <div class="chips" id="words_hot"></div>
                    </div>
                </div>
                <div id="search_results" class="hidden">
                    <div class="results-head">
                        <div class="results-status" id="results_status"></div>
                        <button class="chip" data-action="search-tv">在电视上搜索</button>
                    </div>
                    <div class="filters" id="results_filters"></div>
                    <div class="vod-list" id="results_list"></div>
                </div>
            </section>

            <!-- 媒体库 -->
            <section class="tab-panel" data-panel="library">
                <div class="section-head">
                    <div class="section-title">继续观看</div>
                    <button class="chip" data-action="refresh-library">刷新</button>
                </div>
                <div class="vod-list" id="library_history"></div>
                <div class="section-head"><div class="section-title">收藏</div></div>
                <div class="poster-grid" id="library_keeps"></div>
            </section>

            <!-- 更多 -->
            <section class="tab-panel" data-panel="more">
                <div class="section">
                    <div class="section-title">点播配置</div>
                    <div class="config-list" id="config_list_0"></div>
                    <form class="field-row" data-config="0">
                        <input class="text-input short" type="text" placeholder="名称" />
                        <input class="text-input" type="text" placeholder="配置地址" required />
                        <button class="tonal-btn" type="submit">添加</button>
                    </form>
                    <label class="setting-row" id="source_site_row"><span>首页站点</span><select class="select" id="source_site" data-action="source" data-do="site"></select></label>
                    <label class="setting-row" id="source_parse_row"><span>解析</span><select class="select" id="source_parse" data-action="source" data-do="parse"></select></label>
                </div>
                <div class="section">
                    <div class="section-title">直播配置</div>
                    <div class="config-list" id="config_list_1"></div>
                    <form class="field-row" data-config="1">
                        <input class="text-input short" type="text" placeholder="名称" />
                        <input class="text-input" type="text" placeholder="配置地址" required />
                        <button class="tonal-btn" type="submit">添加</button>
                    </form>
                    <label class="setting-row" id="source_live_row"><span>直播源</span><select class="select" id="source_live" data-action="source" data-do="live"></select></label>
                </div>
                <div id="settings_groups"></div>
                <div class="section" id="enroll_section">
                    <div class="section-title">服务器关联</div>
                    <div class="setting-row"><span>设备编码</span><span class="enroll-code" id="enroll_code"></span></div>
                    <div class="setting-row"><span>状态</span><span id="enroll_state"></span></div>
                    <div class="hint">在服务器后台批准这个编码后，电视会自动获取配置。</div>
                    <div class="field-row">
                        <button class="filled-btn" id="enroll_request" data-action="enroll" data-do="request">申请关联</button>
                        <button class="tonal-btn" id="enroll_refresh" data-action="enroll" data-do="refresh">刷新</button>
                        <button class="tonal-btn" id="enroll_unlink" data-action="enroll" data-do="unlink">取消关联</button>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">已配对设备</div>
                    <div class="config-list" id="device_list"></div>
                </div>
                <div class="section">
                    <div class="section-title">维护</div>
                    <button class="list-row" data-action="files">
                        <span>文件管理</span><span class="row-arrow">›</span>
                    </button>
                    <div class="setting-row"><span>缓存</span><span id="cache_size"></span></div>
                </div>
                <div class="version" id="version"></div>
            </section>

            <!-- 文件（更多 → 文件管理） -->
            <section class="tab-panel" data-panel="files">
                <input type="file" id="file_uploader" multiple />
                <div class="toolbar">
                    <button class="icon-btn small" data-action="files-back" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
                    <div class="toolbar-title" id="files_title">文件</div>
                    <button class="chip" data-action="upload">上传</button>
                    <button class="chip" data-action="new-folder">新建文件夹</button>
                </div>
                <div id="file_list"></div>
            </section>
        </main>

        <!-- 非遥控页签上的迷你播放条 -->
        <button class="mini-player hidden" id="mini_player" data-action="tab" data-tab="remote">
            <div class="mini-progress"><div class="mini-progress-bar" id="mini_progress"></div></div>
            <div class="mini-title" id="mini_title"></div>
            <span class="mini-toggle" id="mini_toggle" data-action="control" data-do="toggle" role="button" aria-label="播放 / 暂停">
                <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </span>
        </button>

        <nav class="nav-bar">
            <button class="nav-item active" data-action="tab" data-tab="remote">
                <span class="nav-indicator"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm0 20H7V3h10v18zM12 6.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-3 7v1.5h6V13.5H9zm0 3v1.5h6V16.5H9z"/></svg></span>
                <span class="nav-label">遥控</span>
            </button>
            <button class="nav-item" data-action="tab" data-tab="search">
                <span class="nav-indicator"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16c1.6 0 3.1-.6 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></span>
                <span class="nav-label">搜索</span>
            </button>
            <button class="nav-item" data-action="tab" data-tab="library">
                <span class="nav-indicator"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg></span>
                <span class="nav-label">媒体库</span>
            </button>
            <button class="nav-item" data-action="tab" data-tab="more">
                <span class="nav-indicator"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>
                <span class="nav-label">更多</span>
            </button>
        </nav>
    </div>

    <!-- 详情面板 -->
    <div id="detail_sheet" class="sheet-overlay" data-action="close-sheet">
        <div class="sheet" data-action="noop">
            <div class="sheet-handle"></div>
            <div class="sheet-body" id="detail_body"></div>
        </div>
    </div>

    <!-- 配对 -->
    <div id="pair_dialog" class="dialog-overlay">
        <form class="dialog" id="pair_form">
            <div class="dialog-title">配对电视</div>
            <div class="dialog-body">
                <div class="hint">在电视上打开「手机控制」，输入屏幕上的 6 位配对码</div>
                <input id="pair_code" class="text-input" type="tel" inputmode="numeric" maxlength="6" placeholder="配对码" autocomplete="one-time-code" />
                <input id="pair_name" class="text-input" type="text" placeholder="本机名称" />
            </div>
            <div class="dialog-actions"><button type="submit" class="dialog-btn">配对</button></div>
        </form>
    </div>

    <!-- 通用确认 -->
    <div id="confirm_dialog" class="dialog-overlay">
        <div class="dialog">
            <div class="dialog-title" id="confirm_title"></div>
            <div class="dialog-body" id="confirm_body"></div>
            <div class="dialog-actions">
                <button class="dialog-btn" data-action="confirm" data-value="0">取消</button>
                <button class="dialog-btn" id="confirm_ok" data-action="confirm" data-value="1">确定</button>
            </div>
        </div>
    </div>

    <!-- 新建文件夹 -->
    <div id="folder_dialog" class="dialog-overlay">
        <form class="dialog" id="folder_form">
            <div class="dialog-title">新建文件夹</div>
            <div class="dialog-body"><input id="folder_name" class="text-input" type="text" placeholder="请输入文件夹名称" /></div>
            <div class="dialog-actions">
                <button type="button" class="dialog-btn" data-action="close-dialog" data-value="folder_dialog">取消</button>
                <button type="submit" class="dialog-btn">确定</button>
            </div>
        </form>
    </div>

    <div id="snackbar" class="snackbar"></div>
    <div id="loading" class="loading"><svg class="progress" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/></svg></div>
</body>
</html>
