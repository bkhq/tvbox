name: Spider

# Builds tvbox.jar, our own spider jar, from spider/ (based on
# FongMi/CatVodSpider). Sites use it with "api": "csp_<Class>" and a "jar"
# pointing at the uploaded file.

on:
  push:
    branches: [main]
    paths:
      - "spider/**"
      - ".github/workflows/spider.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build tvbox.jar
        run: ./gradlew --no-daemon spiderJar

      - uses: actions/upload-artifact@v4
        with:
          name: tvbox-jar
          path: |
            spider/build/tvbox.jar
            spider/build/tvbox.jar.md5
